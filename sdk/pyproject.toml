[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwatch"
version = "0.1.0"
description = "Agent Watch SDK: see, control, and cap what your AI agents do."
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.168.5"]

[tool.setuptools]
packages = ["agentwatch"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
