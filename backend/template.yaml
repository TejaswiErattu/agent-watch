AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Agent Watch ingest/config API, event table, alert topic, route throttling, and a 10 USD monthly cost budget.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives guardrail alerts (confirm the SNS subscription once).
  DashboardOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Deployed dashboard origin allowed by CORS (set to the Amplify URL once it exists).

Globals:
  Function:
    Runtime: python3.11
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref EventTable
        TOPIC_ARN: !Ref AlertTopic
  HttpApi:
    # CORS on the implicit HTTP API. An explicit ServerlessHttpApi resource is
    # ignored by SAM here, so the config must live under Globals to take effect.
    # Only DashboardOrigin is listed: it defaults to http://localhost:3000 and is
    # overridden with the Amplify URL at deploy time. Listing localhost literally
    # as well would duplicate the default, which API Gateway rejects.
    CorsConfiguration:
      AllowOrigins:
        - !Ref DashboardOrigin
      AllowMethods:
        - GET
        - PUT
        - POST
        - OPTIONS
      AllowHeaders:
        - content-type
        - x-agentwatch-owner
        - x-agentwatch-key-hash
    # Stage-level throttling on the implicit API's $default stage: caps abuse of
    # the public endpoint (and the Lambda/DynamoDB bill it drives). Applied as an
    # in-place stage update; ServerlessHttpApi and its URL are unchanged.
    DefaultRouteSettings:
      ThrottlingRateLimit: 10
      ThrottlingBurstLimit: 20

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: agentwatch_api.handlers.api.lambda_handler
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
      Events:
        PostEvents:
          Type: HttpApi
          Properties:
            Method: POST
            Path: /events
        GetAgents:
          Type: HttpApi
          Properties:
            Method: GET
            Path: /agents
        GetEvents:
          Type: HttpApi
          Properties:
            Method: GET
            Path: /agents/{agentId}/events
        GetConfig:
          Type: HttpApi
          Properties:
            Method: GET
            Path: /agents/{agentId}/config
        PutConfig:
          Type: HttpApi
          Properties:
            Method: PUT
            Path: /agents/{agentId}/config
        GetSpend:
          Type: HttpApi
          Properties:
            Method: GET
            Path: /agents/{agentId}/spend

  EventTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: agentId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsiOwnerId
          AttributeType: S
      KeySchema:
        - AttributeName: agentId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ownerIndex
          KeySchema:
            - AttributeName: gsiOwnerId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # Account-wide cost guard. Budgets is a global service, so it works from a
  # us-west-2 stack (CloudWatch billing metrics exist only in us-east-1).
  # Budgets emails AlertEmail directly; no SNS topic policy needed.
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  ApiUrl:
    Description: Base URL for AGENTWATCH_ENDPOINT
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  TableName:
    Value: !Ref EventTable
  TopicArn:
    Value: !Ref AlertTopic
